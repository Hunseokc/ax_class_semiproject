<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 · StockMind</title>
  <meta name="description" content="국내·미국 주요 지수·환율과 주요 종목 (일봉 기준)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="/static/js/pages/home.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main" id="main">
      <div class="main__inner home">
        <h1 class="sr-only">대시보드</h1>

        <section class="section" aria-labelledby="h-market">
          <div class="section__head"><h2 id="h-market">주요 지수 · 환율 <span class="section__meta" id="as-of">일봉 기준</span></h2>
            <div class="section__tools"><div id="spark-range"></div></div></div>
          <div id="market"></div>
        </section>

        <section class="section" aria-labelledby="h-watch">
          <div class="section__head">
            <div><h2 id="h-watch">내 관심종목 <span class="section__meta">일봉 기준</span></h2>
              <p class="subtle">★ 누른 종목의 최근 종가 · ▲▼로 순서 바꾸기</p></div>
            <div class="section__tools"><span class="subtle" id="watch-count"></span><a class="section__link" href="/stocks">주식 리스트 →</a></div></div>
          <div id="watchlist"></div>
        </section>

        <p class="disclaimer">시세는 일봉 기준이며 장중 실시간이 아닙니다. 이 화면의 어떤 정보도 투자 권유가 아닙니다.</p>
      </div>
    </main>
  </div>
</body>
</html>
