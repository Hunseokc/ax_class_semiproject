<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설정 · StockMind</title>
  <meta name="description" content="화면 테마 등 StockMind 설정">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>let t = null; try { t = localStorage.getItem("stockmind:theme"); } catch {} if (t !== "dark") document.documentElement.dataset.theme = "light";</script>   <!-- 테마(기본 라이트): 첫 그리기 전에 적용 (깜빡임 방지) -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <script type="module" src="/static/js/pages/settings.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main" id="main">
      <div class="main__inner">
        <header class="page-head">
          <div><p class="subtle">Settings</p><h1>설정</h1></div>
        </header>
        <section class="card settings" aria-labelledby="h-theme">
          <div class="settings__row">
            <div><h2 id="h-theme" class="settings__title">화면 테마</h2>
              <p class="subtle">이 브라우저에만 저장됩니다.</p></div>
            <div id="theme"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
