<!doctype html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="/static/js/pages/home.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main" id="main">
      <div class="main__inner">
        <header class="page-head">
          <div><p class="subtle">Overview</p><h1>대시보드</h1><p class="page-head__meta" id="as-of">일봉 기준</p></div>
          <div class="page-head__actions" id="preset-menu"></div>
        </header>

        <section class="section" aria-labelledby="h-market">
          <div class="section__head"><h2 id="h-market">주요 지수 · 환율</h2></div>
          <div id="market"></div>
        </section>

        <section class="section" aria-labelledby="h-watch">
          <div class="section__head"><h2 id="h-watch">내 관심종목 <span class="subtle" id="watch-basis"></span></h2><a class="section__link" href="/stocks">주식 리스트 →</a></div>
          <div id="watchlist"></div>
        </section>

        <section class="section" aria-labelledby="h-top">
          <div class="section__head"><h2 id="h-top">거래량 상위 5</h2>
            <div style="display:flex;gap:12px;align-items:center"><div id="top-tabs"></div><a class="section__link" id="top-more" href="/stocks">더 보기 →</a></div></div>
          <div id="top-volume"></div>
        </section>

        <p class="disclaimer">시세는 일봉 기준이며 장중 실시간이 아닙니다. 매력도는 유니버스 안에서 같은 시장끼리 비교한 상대적 위치이며 수익률 예측·투자 권유가 아닙니다. 투자 성향은 공개된 일반적 투자 스타일을 단순화한 가중치이며 특정 인물의 판단이 아닙니다.</p>
      </div>
    </main>
  </div>
