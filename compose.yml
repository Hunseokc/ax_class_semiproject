# DB + API 서버를 함께 실행한다: docker compose up -d --build
# 개발(소스 수정 즉시 반영): docker compose -f compose.yml -f compose.dev.yml up --build
# 적재·관리 명령:            docker compose run --rm api python -m app.ingest <명령>   (Stage 1부터)
name: stockmind

services:
  db:
    image: postgres:16
    container_name: stockmind_db
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stockdb
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5433}:5432"   # 로컬 도구·venv 실행용. 5432는 다른 로컬 PostgreSQL과 충돌할 수 있어 5433 사용
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro   # 테스트 DB 생성 스크립트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stockdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:                        # 2차 로그인: refresh token 저장·폐기, 로그인 시도 제한 (배포는 Upstash)
    image: redis:7.4-alpine
    container_name: stockmind_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stockmind-api
    container_name: stockmind_api
    env_file: .env
    environment:
      # .env의 localhost:5433(호스트에서 접속하는 주소)을 컨테이너 네트워크 주소로 덮어쓴다
      DATABASE_URL: postgresql+psycopg://stock:stock@db:5432/stockdb
      TEST_DATABASE_URL: postgresql+psycopg://stock:stock@db:5432/stockdb_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/srv/data                        # 이상 행 보관(data/quarantine)
      - ${EXTRA_CA_DIR:-./certs}:/certs:ro      # 추가 CA(*.pem·*.crt). 없으면 시스템 CA만 사용
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
