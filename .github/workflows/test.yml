# PR·푸시마다 백엔드 테스트 — 빨간 테스트가 stage·main에 들어가지 않게 한다.
# 계약 검사(team/tools/check_contract.py)는 원본 폴더가 필요해서 여기서 돌리지 않는다(D가 로컬에서 실행).
name: test

on:
  pull_request:                      # Draft PR 포함 — 파일마다 push하면 그때마다 중간 검사
    branches: [main, "stage*"]
  push:
    branches: [main, "stage*"]

# 같은 PR에 새 push가 오면 이전 실행은 취소한다
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: stock
          POSTGRES_PASSWORD: stock
          POSTGRES_DB: stockdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stock -d stockdb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stock:stock@localhost:5432/stockdb
      TEST_DATABASE_URL: postgresql+psycopg://stock:stock@localhost:5432/stockdb_test
      TZ: Asia/Seoul                     # 컨테이너(Dockerfile)와 같은 시간대
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 의존성 설치
        run: pip install -r backend/requirements.txt
      - name: 테스트 DB 생성 (compose의 db/init과 같은 스크립트)
        run: PGPASSWORD=stock psql -h localhost -U stock -d stockdb -f backend/db/init/00_create_test_db.sql
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
