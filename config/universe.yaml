# ---------------------------------------------------------------------
# 매력도 비교군(benchmark) — 화면 노출 종목(위 stocks)과 함께 점수의 비교 표본이 된다 (docs/09 9절)
# 국가별·섹터별 비교군 = 그 섹터의 노출 종목 + 아래 후보 중 시가총액 상위 (per_sector − 노출 종목 수)개
# 섹터 정의(2차전지·방산·빅테크 등)가 KRX 업종·GICS와 1:1로 맞지 않아 후보 풀은 직접 정하고,
# 선정은 적재 시점의 실제 시가총액으로 자동으로 한다. 금융 섹터는 지표 구조가 달라 넣지 않는다.
benchmark:
  per_sector: 10          # 국가별 섹터당 최대 종목 수(노출 종목 포함)
  price_days: 400         # 일봉 보관 기간(달력일) — 변동성·12-1개월 모멘텀에 거래일 253개 필요
  fin_years: 3            # FY 재무 연수
  fin_refresh_days: 455   # 최신 FY 결산일이 이보다 오래되면 새 사업보고서를 확인
  fin_retry_days: 7       # 확인했는데 아직 없으면 이 기간 동안 다시 확인하지 않음
  reselect_days: 30       # 시가총액 순위로 다시 고르는 주기(매일 고르면 경계 종목이 들락날락)
  daily_at_kst: "07:00"   # 매일 이 시각 이후 1회 갱신(미국 장 마감 후)
  detail_ttl_hours: 24    # 상세 화면을 열면 공시·2년 일봉·5개년 재무를 받고, 이 시간 동안은 다시 받지 않음

