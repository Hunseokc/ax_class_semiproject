# Stage 5 계약 — 원본(정답지)과 다르게 두는 것의 전체 목록.
# 검사: python team/tools/check_contract.py 5   (여기 없는 차이가 하나라도 있으면 실패)
# 다음 단계 계약은 이 파일을 복사해 stage{N}.toml로 만들고, 그 단계에서 추가되는 항목을 지운다.
#
#   [[exclude]]     원본에 있지만 이번 단계에서 뺀 것(이후 단계에서 추가). table+columns를 적으면 그 컬럼을
#                   언급하는 제약·인덱스·ORM __table_args__도 함께 빠진 것으로 본다. 나머지는 keys로 적는다.
#   [[allow]]       의도적으로 원본과 다르게 둔 것(사유 필수). 가능하면 쓰지 않는다.
#   [[planned]]     이번 단계에 팀원이 새로 만드는 이름 — 모듈(app.x.y) 또는 모듈:이름, settings:/query: 형식
#   [[skip_import]] 소비자가 원본을 옮길 때 빼는 import(시작 프롬프트의 "이번 단계에서 뺄 것")

stage = 5
required_tables = []   # Stage 5는 새 테이블 없음 — 004_watchlist_memo는 watchlist_items 컬럼만 추가

# 이번 단계 팀원이 옮길 원본 파일 (시작 프롬프트의 [참조 원본] 중 백엔드)
[consumers]
B = ["backend/app/api/watchlist.py", "backend/app/api/analysis.py", "backend/app/queries/watchlist.sql",
     "backend/app/queries/stats_monthly.sql", "backend/app/queries/stats_ranking.sql",
     "backend/app/queries/stats_data_quality.sql", "backend/tests/test_watchlist_api.py", "backend/tests/test_analysis.py"]
C = ["backend/app/services/portfolio.py", "backend/app/services/data_quality.py", "backend/app/api/portfolios.py",
     "backend/app/ingest/__main__.py", "backend/tests/test_equal_weight.py", "backend/tests/test_data_quality.py"]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 1 테이블)
[[exclude]]
table = "stocks"
columns = ["sector", "industry", "sic", "industry_checked_at"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_groups"
columns = ["kind"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "valuation_snapshots"
columns = ["dps"]
until = "Stage 5+ 배당 (원본 migration 005_listed_dividend)"

[[exclude]]
until = "Stage 5~6 — 수집 작업 종류는 단계마다 늘어난다 (BENCHMARK·HYDRATE는 Stage 4-D 003에서 추가됨, SECTORS_*는 006·007)"
keys = [
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying, 'BENCHMARK'::character varying, 'HYDRATE'::character varying, 'SECTORS_US'::character varying, 'SECTORS_KR'::character varying])::text[])))",
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying, 'BENCHMARK'::character varying, 'HYDRATE'::character varying])::text[])))",
]

[[exclude]]
until = "Stage 6-B 상장 목록 — coverage 'listed'는 원본 migration 005_listed_dividend에서 추가 (Stage 4-D 003은 featured·benchmark만)"
keys = [
  "constraint:stocks:CHECK (((coverage)::text = ANY ((ARRAY['featured'::character varying, 'benchmark'::character varying, 'listed'::character varying])::text[])))",
  "constraint:stocks:CHECK (((coverage)::text = ANY ((ARRAY['featured'::character varying, 'benchmark'::character varying])::text[])))",
  "orm:Stock.__table_args__:CheckConstraint(\"coverage IN ('featured','benchmark','listed')\")",
  "orm:Stock.__table_args__:CheckConstraint(\"coverage IN ('featured','benchmark')\")",
]

# ------------------------------------------------------------------ 원본과 다르게 둔 것
[[allow]]
keys = ["view:v_stock_metrics"]
reason = "원본 끝 열 dps·dividend_yield(배당, migration 005)는 Stage 5+ — 그 전까지는 B가 원본으로 바꿔도 이 두 열만큼 다르다. 지금은 D 껍데기(값 일부만 채움)"

# ------------------------------------------------------------------ 이번 단계에 팀원이 만드는 것
# owner는 본문을 원본대로 쓰는 사람. D가 단계 시작 때 껍데기(TODO(껍데기))를 먼저 넣는 이름도 여기 적는다.
[[planned]]
owner = "B"
names = ["query:stats_monthly", "query:stats_ranking", "query:stats_data_quality"]

[[planned]]
owner = "C"
names = ["app.services.data_quality", "app.services.data_quality:data_quality"]

[[planned]]
owner = "D(Stage 4)"
names = ["app.api.deps:get_hydrator", "app.api.deps:get_scorer", "app.services.hydration"]   # Stage 4-D 남은 작업 — stage4 머지가 stage5로 들어오면 생긴다

[[planned]]
owner = "C(Stage 4)"
names = ["app.ingest:explain"]   # Stage 4-C 남은 작업 — stage4 머지가 stage5로 들어오면 생긴다

# ------------------------------------------------------------------ 옮길 때 빼는 import
[[skip_import]]
names = ["app.services.reference_score:reference_score"]
reason = "상장 목록(listed) 참고 점수는 Stage 6 — analysis 응답에서 reference·reference_note를 뺀다"

[[skip_import]]
names = ["app.services:freshness", "app.providers.base:ValuationBase"]
reason = "데이터 유효기간(freshness)·미국 기초값(fundamental_bases)은 Stage 5-D — hydration은 freshness 없이 항상 받는다"

[[skip_import]]
names = ["app.providers.base:Classification", "app.services.sectors:load_sectors", "app.ingest.sectors:sectors",
         "app.ingest.sectors:sector_for_krx", "app.ingest.sectors:sector_for_sic"]
reason = "업종 분류·섹터(kind='sector', SECTORS_*)는 Stage 5~6 — Stage 4 비교군은 universe.yaml 경쟁 그룹 기준"

[[skip_import]]
names = ["app.ingest.listing:sync_listing", "app.providers.base:Listing", "app.schemas.api:SearchOut", "query:stock_search"]
reason = "상장 목록(listing)·상단 검색(/stocks/search)은 Stage 6-B"

[[skip_import]]
names = ["app.services.market_calendar:session_status"]
reason = "지수 장 상태(session_status)는 Stage 6-D"
