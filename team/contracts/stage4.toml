# Stage 4 계약 — 원본(정답지)과 다르게 두는 것의 전체 목록.
# 검사: python team/tools/check_contract.py 4   (여기 없는 차이가 하나라도 있으면 실패)
# 다음 단계 계약은 이 파일을 복사해 stage{N}.toml로 만들고, 그 단계에서 추가되는 항목을 지운다.
#
#   [[exclude]]     원본에 있지만 이번 단계에서 뺀 것(이후 단계에서 추가). table+columns를 적으면 그 컬럼을
#                   언급하는 제약·인덱스·ORM __table_args__도 함께 빠진 것으로 본다. 나머지는 keys로 적는다.
#   [[allow]]       의도적으로 원본과 다르게 둔 것(사유 필수). 가능하면 쓰지 않는다.
#   [[planned]]     이번 단계에 팀원이 새로 만드는 이름 — 모듈(app.x.y) 또는 모듈:이름, settings:/query: 형식
#   [[skip_import]] 소비자가 원본을 옮길 때 빼는 import(시작 프롬프트의 "이번 단계에서 뺄 것")

stage = 4
required_tables = ["scoring_presets", "scoring_weights", "stock_metric_values", "stock_scores"]

# 이번 단계 팀원이 옮길 원본 파일 (시작 프롬프트의 [참조 원본] 중 백엔드)
[consumers]
C = ["backend/config/scoring.yaml", "backend/app/services/scoring.py", "backend/app/queries/score_metrics.sql",
     "backend/app/queries/score_zscore.sql", "backend/app/queries/score_neutralize.sql",
     "backend/app/queries/score_aggregate.sql", "backend/app/ingest/explain.py", "backend/app/ingest/__main__.py",
     "backend/tests/test_scoring.py"]
B = ["backend/app/api/analysis.py", "backend/app/api/deps.py", "backend/app/queries/analysis.sql",
     "backend/app/queries/peers.sql", "backend/app/queries/peers_chart.sql", "backend/app/queries/stats_overview.sql",
     "backend/app/queries/stats_market_valuation.sql", "backend/app/queries/stats_market_excluded.sql",
     "backend/app/queries/stats_peer_group_valuation.sql", "backend/app/queries/stats_disclosure_frequency.sql",
     "backend/tests/test_analysis.py"]
D = ["backend/app/ingest/benchmark.py", "backend/app/services/hydration.py", "backend/tests/test_benchmark.py"]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 1 테이블)
[[exclude]]
table = "stocks"
columns = ["coverage", "detail_synced_at"]
until = "Stage 4-D 비교군 — D의 [내 구현] 1번(원본 migration 003_benchmark)에서 추가하고 이 항목을 지운다"

[[exclude]]
table = "stocks"
columns = ["sector", "industry", "sic", "industry_checked_at"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_groups"
columns = ["kind"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "valuation_snapshots"
columns = ["dps"]
until = "Stage 5+ 배당 (원본 migration 005_listed_dividend)"

[[exclude]]
until = "Stage 4-D+ — 수집 작업 종류는 단계마다 늘어난다 (BENCHMARK·HYDRATE는 Stage 4-D 비교군, SECTORS_*는 006·007)"
keys = [
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying, 'BENCHMARK'::character varying, 'HYDRATE'::character varying, 'SECTORS_US'::character varying, 'SECTORS_KR'::character varying])::text[])))",
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying])::text[])))",
]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 2 테이블)
[[exclude]]
table = "watchlist_items"
columns = ["memo", "target_price", "updated_at"]
until = "Stage 5-B 메모·목표가 (원본 migration 004_watchlist_memo — updated_at·트리거도 이 마이그레이션)"
keys = ["trigger:watchlist_items:CREATE TRIGGER trg_watchlist_items_updated_at BEFORE UPDATE ON public.watchlist_items FOR EACH ROW EXECUTE FUNCTION set_updated_at()"]

# ------------------------------------------------------------------ 원본과 다르게 둔 것
[[allow]]
keys = ["view:v_stock_metrics"]
reason = "원본 끝 열 dps·dividend_yield(배당, migration 005)는 Stage 5+ — 그 전까지는 B가 원본으로 바꿔도 이 두 열만큼 다르다. 지금은 D 껍데기(값 일부만 채움)"

# ------------------------------------------------------------------ 이번 단계에 팀원이 만드는 것
# owner는 본문을 원본대로 쓰는 사람. D가 단계 시작 때 껍데기(TODO(껍데기))를 먼저 넣는 이름도 여기 적는다.
[[planned]]
owner = "C"
names = ["app.services.scoring", "query:score_metrics", "query:score_zscore", "query:score_neutralize",
         "query:score_aggregate", "app.ingest:explain"]

[[planned]]
owner = "B"
names = ["app.api.deps:get_preset", "query:analysis", "query:peers", "query:peers_chart", "query:stock_groups",
         "query:stats_overview", "query:stats_market_valuation", "query:stats_market_excluded",
         "query:stats_peer_group_valuation", "query:stats_disclosure_frequency"]

[[planned]]
owner = "D"
names = ["app.ingest.jobs:migrate", "app.api.deps:get_scorer", "app.ingest.benchmark", "app.ingest:benchmark",
         "app.services.hydration", "app.services:hydration", "app.ingest.store:BENCHMARK_LOCK_KEY",
         "app.ingest.universe:FREQUENT_SQL", "app.services.scheduler:SEOUL", "app.services.scheduler:benchmark_due",
         "app.services.scheduler:daily_boundary"]

[[planned]]
owner = "C(Stage 3)"
names = ["app.ingest.universe:stock_refs"]   # Stage 3 계약의 C 항목 — stage3 머지가 stage4로 들어오면 생긴다

# ------------------------------------------------------------------ 옮길 때 빼는 import
[[skip_import]]
names = ["query:stats_monthly", "query:stats_ranking", "app.services.data_quality:data_quality"]
reason = "통계 monthly·ranking·data-quality는 Stage 5 (B 시작 프롬프트 '이번 단계에서 뺄 것')"

[[skip_import]]
names = ["app.services.reference_score:reference_score"]
reason = "상장 목록(listed) 참고 점수는 Stage 6 — analysis 응답에서 reference·reference_note를 뺀다"

[[skip_import]]
names = ["app.services:freshness", "app.providers.base:ValuationBase"]
reason = "데이터 유효기간(freshness)·미국 기초값(fundamental_bases)은 Stage 5-D — hydration은 freshness 없이 항상 받는다"

[[skip_import]]
names = ["app.providers.base:Classification", "app.services.sectors:load_sectors", "app.ingest.sectors:sectors",
         "app.ingest.sectors:sector_for_krx", "app.ingest.sectors:sector_for_sic"]
reason = "업종 분류·섹터(kind='sector', SECTORS_*)는 Stage 5~6 — Stage 4 비교군은 universe.yaml 경쟁 그룹 기준"

[[skip_import]]
names = ["app.ingest.listing:sync_listing", "app.providers.base:Listing", "app.schemas.api:SearchOut", "query:stock_search"]
reason = "상장 목록(listing)·상단 검색(/stocks/search)은 Stage 6-B"

[[skip_import]]
names = ["app.services.market_calendar:session_status"]
reason = "지수 장 상태(session_status)는 Stage 6-D"
