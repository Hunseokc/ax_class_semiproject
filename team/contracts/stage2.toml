# Stage 2 계약 — 원본(정답지)과 다르게 두는 것의 전체 목록.
# 검사: python team/tools/check_contract.py 2   (여기 없는 차이가 하나라도 있으면 실패)
# 다음 단계 계약은 이 파일을 복사해 stage{N}.toml로 만들고, 그 단계에서 추가되는 항목을 지운다.
#
#   [[exclude]]     원본에 있지만 이번 단계에서 뺀 것(이후 단계에서 추가). table+columns를 적으면 그 컬럼을
#                   언급하는 제약·인덱스·ORM __table_args__도 함께 빠진 것으로 본다. 나머지는 keys로 적는다.
#   [[allow]]       의도적으로 원본과 다르게 둔 것(사유 필수). 가능하면 쓰지 않는다.
#   [[planned]]     이번 단계에 팀원이 새로 만드는 이름 — 모듈(app.x.y) 또는 모듈:이름, settings:/query: 형식
#   [[skip_import]] 소비자가 원본을 옮길 때 빼는 import(시작 프롬프트의 "이번 단계에서 뺄 것")

stage = 2
required_tables = ["users", "watchlist_items", "portfolios", "portfolio_items"]

# 이번 단계 팀원이 옮길 원본 파일 (시작 프롬프트의 [참조 원본] 중 백엔드)
[consumers]
C = ["backend/app/services/fx.py", "backend/app/services/portfolio.py", "backend/app/api/portfolios.py",
     "backend/app/queries/portfolio_items_valued.sql"]
B = ["backend/app/api/watchlist.py", "backend/app/queries/watchlist.sql", "backend/tests/test_watchlist_api.py"]
D = ["backend/app/ingest/demo.py"]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 1 테이블)
[[exclude]]
table = "stocks"
columns = ["coverage", "detail_synced_at"]
until = "Stage 4-D 비교군 (원본 migration 003_benchmark)"

[[exclude]]
table = "stocks"
columns = ["sector", "industry", "sic", "industry_checked_at"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_groups"
columns = ["kind"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_group_members"
columns = ["is_primary"]
until = "Stage 4 매력도 v2 (원본 migration 001_scoring_v2)"

[[exclude]]
table = "valuation_snapshots"
columns = ["dps"]
until = "Stage 5+ 배당 (원본 migration 005_listed_dividend)"

[[exclude]]
until = "Stage 3+ — 수집 작업 종류는 단계마다 늘어난다 (FINANCIALS·DISCLOSURES는 Stage 3, 나머지는 003·007)"
keys = [
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying, 'BENCHMARK'::character varying, 'HYDRATE'::character varying, 'SECTORS_US'::character varying, 'SECTORS_KR'::character varying])::text[])))",
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'MASTER'::character varying])::text[])))",
]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 2 테이블)
[[exclude]]
table = "watchlist_items"
columns = ["memo", "target_price", "updated_at"]
until = "Stage 5-B 메모·목표가 (원본 migration 004_watchlist_memo — updated_at·트리거도 이 마이그레이션)"
keys = ["trigger:watchlist_items:CREATE TRIGGER trg_watchlist_items_updated_at BEFORE UPDATE ON public.watchlist_items FOR EACH ROW EXECUTE FUNCTION set_updated_at()"]

# ------------------------------------------------------------------ 이번 단계에 팀원이 만드는 것
[[planned]]
owner = "C"
names = [
  "app.services.fx", "app.services.portfolio", "query:portfolio_items_valued",
  "app.api.deps:get_fx_service", "app.api.deps:get_portfolio_service",
  "app.schemas.api:ItemCreate", "app.schemas.api:ItemInput", "app.schemas.api:ItemOut", "app.schemas.api:ItemsOut",
  "app.schemas.api:PortfolioCreate", "app.schemas.api:PortfolioOut", "app.schemas.api:PortfolioUpdate",
  "app.schemas.api:SummaryOut",
]

[[planned]]
owner = "B"
names = ["query:watchlist", "app.schemas.api:WatchlistCard", "app.schemas.api:WatchlistCreate",
         "app.schemas.api:WatchlistOrder", "app.schemas.api:WatchlistOut"]

[[planned]]
owner = "D"
names = ["app.ingest.jobs:seed_demo_watchlist"]

# ------------------------------------------------------------------ 옮길 때 빼는 import
[[skip_import]]
names = ["app.schemas.api:EqualWeightOut", "app.schemas.api:EqualWeightRequest"]
reason = "균등 배분 미리보기(preview/equal-weight)는 Stage 2 제외"

[[skip_import]]
names = ["app.schemas.api:WatchlistUpdate"]
reason = "관심종목 PUT(메모·목표가)은 Stage 5-B"

[[skip_import]]
names = ["app.api.deps:get_preset", "app.services.scoring:default_preset"]
reason = "매력도 프리셋은 Stage 4 — watchlist·portfolio의 점수 필드는 null"

[[skip_import]]
names = ["app.api.deps:get_hydrator", "app.services.hydration:Hydrator", "orm-use:Stock.coverage", "orm-use:Stock.detail_synced_at"]
reason = "요청 시 상세 수집(hydration)·coverage는 Stage 4-D — 관심종목 추가 시 hydrator.request 호출을 뺀다"
