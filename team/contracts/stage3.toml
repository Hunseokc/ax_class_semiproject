# Stage 3 계약 — 원본(정답지)과 다르게 두는 것의 전체 목록.
# 검사: python team/tools/check_contract.py 3   (여기 없는 차이가 하나라도 있으면 실패)
# 다음 단계 계약은 이 파일을 복사해 stage{N}.toml로 만들고, 그 단계에서 추가되는 항목을 지운다.
#
#   [[exclude]]     원본에 있지만 이번 단계에서 뺀 것(이후 단계에서 추가). table+columns를 적으면 그 컬럼을
#                   언급하는 제약·인덱스·ORM __table_args__도 함께 빠진 것으로 본다. 나머지는 keys로 적는다.
#   [[allow]]       의도적으로 원본과 다르게 둔 것(사유 필수). 가능하면 쓰지 않는다.
#   [[planned]]     이번 단계에 팀원이 새로 만드는 이름 — 모듈(app.x.y) 또는 모듈:이름, settings:/query: 형식
#   [[skip_import]] 소비자가 원본을 옮길 때 빼는 import(시작 프롬프트의 "이번 단계에서 뺄 것")

stage = 3
required_tables = ["financial_statements", "disclosures"]

# 이번 단계 팀원이 옮길 원본 파일 (시작 프롬프트의 [참조 원본] 중 백엔드)
[consumers]
C = ["backend/app/providers/http.py", "backend/app/providers/krx.py", "backend/app/providers/yahoo.py",
     "backend/app/providers/factory.py", "backend/app/ingest/universe.py", "backend/app/ingest/jobs.py",
     "backend/app/ingest/__main__.py", "backend/tests/fakes.py", "backend/tests/test_ingest.py"]
B = ["backend/app/providers/dart.py", "backend/app/providers/sec.py", "backend/app/api/stocks.py",
     "backend/app/queries/financials.sql", "backend/app/queries/disclosures.sql"]
D = ["backend/app/ingest/store.py", "backend/app/services/refresh.py", "backend/app/services/scheduler.py",
     "backend/app/api/market.py", "backend/tests/test_refresh.py"]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 1 테이블)
[[exclude]]
table = "stocks"
columns = ["coverage", "detail_synced_at"]
until = "Stage 4-D 비교군 (원본 migration 003_benchmark)"

[[exclude]]
table = "stocks"
columns = ["sector", "industry", "sic", "industry_checked_at"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_groups"
columns = ["kind"]
until = "Stage 5-D 업종 섹터 (원본 migration 006_sector_freshness)"

[[exclude]]
table = "peer_group_members"
columns = ["is_primary"]
until = "Stage 4 매력도 v2 (원본 migration 001_scoring_v2)"

[[exclude]]
table = "valuation_snapshots"
columns = ["dps"]
until = "Stage 5+ 배당 (원본 migration 005_listed_dividend)"

[[exclude]]
until = "Stage 4+ — 수집 작업 종류는 단계마다 늘어난다 (SCORES·BENCHMARK·HYDRATE는 Stage 4, SECTORS_*는 006·007)"
keys = [
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'SCORES'::character varying, 'MASTER'::character varying, 'BENCHMARK'::character varying, 'HYDRATE'::character varying, 'SECTORS_US'::character varying, 'SECTORS_KR'::character varying])::text[])))",
  "constraint:ingestion_logs:CHECK (((job_type)::text = ANY ((ARRAY['PRICES'::character varying, 'INDICES'::character varying, 'FX'::character varying, 'VALUATION'::character varying, 'FINANCIALS'::character varying, 'DISCLOSURES'::character varying, 'MASTER'::character varying])::text[])))",
]

# ------------------------------------------------------------------ 이후 단계 컬럼 (Stage 2 테이블)
[[exclude]]
table = "watchlist_items"
columns = ["memo", "target_price", "updated_at"]
until = "Stage 5-B 메모·목표가 (원본 migration 004_watchlist_memo — updated_at·트리거도 이 마이그레이션)"
keys = ["trigger:watchlist_items:CREATE TRIGGER trg_watchlist_items_updated_at BEFORE UPDATE ON public.watchlist_items FOR EACH ROW EXECUTE FUNCTION set_updated_at()"]

# ------------------------------------------------------------------ 이번 단계에 팀원이 만드는 것
# (D의 껍데기가 이미 있는 이름 — load_* 함수, Providers 필드, WindowLimiter, financials·disclosures·refresh 엔드포인트 — 는 적지 않는다)
[[planned]]
owner = "C"
names = ["app.ingest.universe:stock_refs", "app.ingest.universe:index_refs", "app.providers.convert:positive_or_none"]

[[planned]]
owner = "B"
names = ["app.providers.dart", "app.providers.sec", "query:financials", "query:disclosures"]

[[planned]]
owner = "D"
names = ["app.ingest.store:advisory_lock", "app.ingest.store:DART_LOCK_KEY", "app.services.refresh",
         "app.services.scheduler", "app.api.deps:get_providers", "app.api.deps:get_refresh_service",
         "settings:scheduler_enabled", "settings:scheduler_check_minutes"]

# ------------------------------------------------------------------ 옮길 때 빼는 import
[[skip_import]]
names = ["app.api.deps:get_preset", "app.api.deps:get_scorer", "app.services.scoring:default_preset",
         "app.services.scoring:compute_scores", "app.services.scoring:sync_presets"]
reason = "매력도 점수·프리셋은 Stage 4 — refresh의 SCORES 작업은 자리 주석만, 마스터의 프리셋 동기화는 뺀다"

[[skip_import]]
names = ["app.api.deps:get_hydrator", "app.services.hydration:Hydrator", "app.services.hydration:hydrate",
         "app.ingest.benchmark:run_benchmark", "app.ingest:benchmark", "app.ingest.universe:FREQUENT_SQL",
         "app.ingest.store:BENCHMARK_LOCK_KEY", "orm-use:Stock.coverage", "orm-use:Stock.detail_synced_at"]
reason = "비교군(benchmark)·요청 시 상세 수집(hydration)·coverage 범위 구분은 Stage 4-D — Stage 3 갱신 대상은 활성 종목 전체"

[[skip_import]]
names = ["app.ingest:explain"]
reason = "점수 설명 CLI(explain)는 Stage 4-C"

[[skip_import]]
names = ["app.services:freshness", "app.services.data_quality:data_quality", "app.providers.base:ValuationBase"]
reason = "데이터 유효기간(freshness)·미국 기초값(fundamental_bases)은 Stage 5-D, 데이터 품질(status CLI)은 Stage 5-C"

[[skip_import]]
names = ["app.providers.base:Classification", "app.services.sectors:load_sectors"]
reason = "업종 분류·섹터(get_sector_classifications, SECTORS_*)는 Stage 5~6"

[[skip_import]]
names = ["app.providers.base:Listing", "app.ingest.listing:sync_listing", "app.schemas.api:SearchOut", "query:stock_search"]
reason = "상장 목록(listing)·상단 검색(/stocks/search)은 Stage 6-B"

[[skip_import]]
names = ["app.services.market_calendar:session_status"]
reason = "지수 장 상태(session_status)는 Stage 6-D"
