# 매력도 다중 팩터 모델 설정 → scoring_presets·scoring_weights로 적재 (개발산출물/09)
# 유니버스 안에서의 상대적 위치를 나타내는 팩터 점수이며 수익률 예측·투자 권유가 아니다.

# 모델 버전 — 점수 행(data_quality.model_version)에 남겨 같은 버전의 점수 이력만 비교한다(D-013).
# 지표·합산 규칙을 바꾸면 올린다. v2 = 개발산출물/11 R11안(검토_장부 D-002)
# v2.1 = 저평가는 B/P만 테마 중립화, 가치 함정 신호는 감점만(D-018, 수정 2 PR A)
# v2.2 = 로버스트 Z(±3) → 순위 정규 점수 RN(D-019, 수정 2 PR C)
# v2.3 = 주 테마는 연결 매출 최대 사업 부문(직접 지정), 지분법 지주·금융 연결 점수 없음(D-024·D-025, 수정 3 PR A)
# v2.4 = 재무 표시통화 원화 환산, 자본 ≤ 0이면 B/P 없음, 우선주 보통주 몫(D-026·D-027·D-029, 수정 3 PR B)
# v2.5 = 금융 묶음은 종합 점수·순위 없음(업종 안 P/B–ROE 비교), 성장 이름 '과거 실적 성장'(D-028·D-032, 수정 3 PR C)
model_version: v2.5-2026-10-27

# 섹터 중립화 축소 계수: z_adj = z − n/(n+k) × 주그룹 z 평균 (n = 주 그룹의 유효 표본 수)
shrinkage_k: 5

# 저평가 이익 = min(지배주주 순이익, after_tax × 영업이익) — 1 − 법인세 근사(미국 21%·국내 지방세 포함 24.2% 사이, D-002)
after_tax: 0.78

default_preset: balanced

# 투자 성향 프리셋. sort_order 순서로 화면에 표시한다(위험 → 성장 → 균형 → 가치).
# 여기서 빠진 프리셋은 적재 시 DB에서 점수와 함께 삭제된다.
# 가중치 합은 정확히 1이어야 한다(적재 시 검증). 소수점 셋째 자리까지(NUMERIC(4,3))
# 공개된 일반적 투자 스타일을 단순화한 가중치이며 특정 인물의 판단이 아니다.
presets:
  - code: aggressive
    name: 위험
    description: 모멘텀·성장 중심
    sort_order: 1
    weights: {value: 0.05, quality: 0.10, growth: 0.35, safety: 0.10, momentum: 0.40}
  - code: growth
    name: 성장
    description: 최근 실적이 크게 늘어난 회사 중심 — 미래 성장 예측이 아닙니다
    sort_order: 2
    weights: {value: 0.10, quality: 0.20, growth: 0.40, safety: 0.05, momentum: 0.25}
  - code: balanced
    name: 균형
    description: 5개 팩터 균등
    sort_order: 3
    weights: {value: 0.20, quality: 0.20, growth: 0.20, safety: 0.20, momentum: 0.20}
  - code: value
    name: 가치
    description: 저평가·안정성 중심
    sort_order: 4
    weights: {value: 0.40, quality: 0.20, growth: 0.10, safety: 0.20, momentum: 0.10}
