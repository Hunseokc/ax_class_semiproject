  # 금·은 등 상품 신탁(SIC 6221 — GLD·IAU·ProShares Trust 등): 주식이 아니라 실물·선물 보유분이라 점수를 내지 않는다(D-004)
  - {name: 상품 신탁, sector: 금융, scoring: none, sic: ["6221"], tickers: [GLD, IAU],
     unscored_reason: "금·은 같은 상품을 보유하는 신탁은 영업하는 회사가 아니라서 매력도 점수를 내지 않습니다. 보유 상품 가격을 함께 보세요."}

# 보조 테마 — 주 테마 밖의 큰 사업. 경쟁 비교·테마 필터에만 쓰고 섹터 중립화·비교군 선정에는 쓰지 않는다
secondary_themes:
  "005930": [하드웨어·통신장비, 전자부품·디스플레이]     # 삼성전자: 모바일·가전, 디스플레이
  AMZN: [유통·커머스, 소프트웨어·IT서비스]               # 온라인 상거래, 클라우드
  AAPL: [하드웨어·통신장비]
  MSFT: [소프트웨어·IT서비스]
  GOOGL: [인터넷 플랫폼]
  META: [인터넷 플랫폼]
  "096770": [2차전지]                                     # SK이노베이션: 배터리
  "009830": [석유화학]                                    # 한화솔루션: 케미칼
  "103140": [비철금속]                                    # 풍산: 신동(구리 가공)
  "064350": [기계·로봇]                                   # 현대로템: 철도차량

# 수집 적재 공통
ingest:
  flush_every: 20         # 재무·공시 적재를 몇 개 회사마다 한 트랜잭션으로 저장할지 (D3). 상세 수집(회사 1개)은 결과가 같다

# 백그라운드 재무 적재(상장 목록 종목을 우선순위대로 미리 받기, app/ingest/background.py)
# 단위: ingestion_logs 행 수(회사 1건 = 1행 ≈ DART 호출 2~5번). 상세 화면·07:00 갱신이 쓴 행도 같이 센다
background:
  dart_calls_per_day: 2000   # 오늘(서울 0시부터) source='DART' 재무·공시 행이 이 수에 닿으면 멈춤 — 키 1개 하루 약 2만 번의 절반 이하 (D12 시작값)
  sec_calls_per_day: 1000    # source='SEC' 같은 기준
  us_rank_pool: 1500         # 미국은 시가총액(SEC 발행주식수 × 종가) 상위 이만큼 안에서만 순위대로 받는다 (D11)
  us_rank_days: 30           # 미국 순위를 다시 매기는 주기 — 전 종목 종가 묶음 조회가 약 2분이라 매일 하지 않는다
  run_at_kst: "08:00"        # 07:00 비교군 갱신 뒤
