# 점수 비교 표본의 섹터(섹터 중립화 주 그룹). krx: KRX 업종명, sic: SEC SIC 코드 범위("시작-끝" 또는 단일)
# 한 SIC가 여러 범위에 걸리면 가장 좁은 범위가 이긴다. 어느 섹터에도 없으면 비교 표본에 넣지 않는다
# 금융·보험·부동산(KRX 기타금융·증권·보험·은행·금융·부동산, SIC 6000-6799)은 매출·영업이익 구조가 달라 제외
sectors:
  - name: 반도체·전자
    krx: [전기·전자]
    sic: ["3570-3579", "3600-3699"]
  - name: IT·인터넷
    krx: [IT 서비스, 통신, 출판·매체복제]
    sic: ["2700-2799", "4800-4899", "7370-7379"]
  - name: 헬스케어
    krx: [제약, 의료·정밀기기]
    sic: ["2830-2836", "3826", "3840-3851", "5047", "5122", "8000-8099", "8731"]
  - name: 자동차·운송장비
    krx: [운송장비·부품]
    sic: ["3710-3716", "3740-3743", "3750-3751", "3790-3799"]
  - name: 산업재
    krx: [기계·장비, 건설, 운송·창고, 기타제조]
    sic: ["1500-1799", "3400-3569", "3580-3599", "3720-3729", "3730-3732", "3760-3769", "3800-3839",
          "4000-4799", "5000-5099", "7380-7389", "8700-8748"]
  - name: 소재
    krx: [화학, 금속, 비금속, 종이·목재]
    sic: ["1000-1499", "2400-2499", "2600-2699", "2800-2829", "2850-2899", "3000-3099", "3200-3399"]
  - name: 필수소비재
    krx: [음식료·담배, 농업 임업 및 어업]
    sic: ["0100-0999", "2000-2199", "2840-2844", "5140-5149", "5400-5499", "5900-5912"]
  - name: 경기소비재
    krx: [유통, 섬유·의류, 오락·문화, 일반서비스]
    sic: ["2200-2399", "2500-2599", "3100-3199", "3630-3652", "3860-3999", "5100-5139", "5150-5399",
          "5500-5899", "5913-5999", "7000-7369", "7500-7999", "8200-8299"]
  - name: 에너지·유틸리티
    krx: [전기·가스, 전기·가스·수도]
    sic: ["1300-1399", "2900-2999", "4900-4999"]

# 수집 적재 공통
ingest:
  flush_every: 20         # 재무·공시 적재를 몇 개 회사마다 한 트랜잭션으로 저장할지 (D3). 상세 수집(회사 1개)은 결과가 같다

# 백그라운드 재무 적재(상장 목록 종목을 우선순위대로 미리 받기, app/ingest/background.py)
# 단위: ingestion_logs 행 수(회사 1건 = 1행 ≈ DART 호출 2~5번). 상세 화면·07:00 갱신이 쓴 행도 같이 센다
background:
  dart_calls_per_day: 2000   # 오늘(서울 0시부터) source='DART' 재무·공시 행이 이 수에 닿으면 멈춤 — 키 1개 하루 약 2만 번의 절반 이하 (D12 시작값)
  sec_calls_per_day: 1000    # source='SEC' 같은 기준
  us_rank_pool: 1500         # 미국은 시가총액(SEC 발행주식수 × 종가) 상위 이만큼 안에서만 순위대로 받는다 (D11)
  us_rank_days: 30           # 미국 순위를 다시 매기는 주기 — 전 종목 종가 묶음 조회가 약 2분이라 매일 하지 않는다
  run_at_kst: "08:00"        # 07:00 비교군 갱신 뒤
