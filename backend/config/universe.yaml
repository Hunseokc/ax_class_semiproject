# ---------------------------------------------------------------------
# 매력도 비교군(benchmark) — 화면 노출 종목(위 stocks)과 함께 점수의 비교 표본이 된다 (개발산출물/09 11절)
# 국가별·테마별 비교군 = 그 테마의 노출 종목 + 같은 주 테마로 분류된 상장 종목 중 시가총액 상위 (per_sector − 노출 종목 수)개
# 순서: 국내는 KRX 전 종목 시가총액(1회 조회, 실패하면 DB 최신값), 미국은 stocks.cap_rank(SEC 발행주식수 × 종가 순위, app/ingest/background.py)
benchmark:
  per_sector: 10          # 국가별 테마당 최대 종목 수(노출 종목 포함)
  price_days: 800         # 일봉 보관 기간(달력일) — 변동성·12-1개월 모멘텀에 거래일 253개 필요. 800 = 약 2년: 점수 이력의 수익률 검증용(D-013)
  fin_years: 5            # FY 재무 연수(D-033 — 점수는 최근 3개, 5년은 M1 측정용). 분기는 jobs.FIN_QUARTERS (유효기간은 data_freshness — 공시 일정 기반 + 90일 상한)
  reselect_days: 30       # 시가총액 순위로 다시 고르는 주기(매일 고르면 경계 종목이 들락날락)
  daily_at_kst: "07:00"   # 매일 이 시각 이후 1회 갱신(미국 장 마감 후)
  detail_ttl_hours: 24    # 상세 화면을 열면 가격 증분 + 유효기간이 지난 데이터만 받고, 이 시간 동안은 다시 확인하지 않음
  fin_daily_budget: 100   # 07:00 갱신이 하루에 재무를 받는 비교군 종목 수 상한(유효기간이 가장 오래 지난 순). 노출·관심 종목은 무관 (D4 임시값 — 첫 배포 뒤 BENCHMARK 실행 시간을 보고 확정)
  industry_recheck_days: 365   # 업종 코드(국내 KSIC·미국 SIC)는 거의 바뀌지 않아 이 주기로만 다시 확인(종목마다 DART·SEC 호출 1번)
  classify_per_run: 3000       # 한 번의 선정에서 업종 코드를 받는 종목 수 상한(국가별). 처음 적재는 국내 약 2,500 · 미국 약 1,500

# ---------------------------------------------------------------------
# 업종 섹터 — 화면 섹터 필터·시장·섹터 점수의 섹터 흐름(stocks.sector). 종목의 섹터는 주 테마의 sector다
sectors: [반도체·전자, IT·인터넷, 헬스케어, 자동차·운송장비, 산업재, 에너지·유틸리티, 소재, 필수소비재, 경기소비재, 금융]

# 테마 — 매력도 섹터 중립화의 주 그룹, 비교군을 고르는 단위, 화면 경쟁 비교 그룹 (개발산출물/09 4·11절)
# 종목마다 주 테마 1개: tickers 직접 지정 > 업종 코드. ksic = DART 기업개황 induty_code 접두어(가장 긴 접두어가 이긴다),
#   sic = SEC SIC 범위("시작-끝" 또는 단일, 가장 좁은 범위가 이긴다). 어느 테마에도 없으면 테마·섹터 없음 → 비교 표본 제외
# 주 테마 기준(D-024, 09 11절): 연결 매출이 가장 큰 사업 부문. 그 부문이 영업적자이고 다른 한 부문이 (흑자인) 전체 영업이익의
#   50% 이상이면 그 부문. 업종 코드는 법인(별도)·등록 당시 기준이라 연결 주력 사업과 다를 수 있어 초깃값으로만 쓰고,
#   다른 종목은 아래 tickers에 직접 지정한다 — 종목마다 근거(부문 매출·비중, 사업보고서·10-K 연도)를 주석으로 남긴다.
#   판정하지 못한 종목(현대바이오·HON·CTAS·FISV·CPAY·PYPL)은 업종 코드 그대로다(09 11절 목록).
#   지분법 지주·금융 연결 회사는 지주회사 테마(점수 없음, D-025). 새 종목을 넣는 PR은 주 테마를 이 기준으로 확인한다
# 노출 종목(stocks)은 반드시 tickers로 지정한다(업종 코드를 받기 전에도 master 적재만으로 주 테마가 정해지게)
# scoring: general(기본) / financial(금융끼리 표준화, 매출 기준 지표 제외) / none(점수를 내지 않음 — 리츠·지주회사·상품 신탁, 사유는 unscored_reason)
# commodity: 원자재 연동 테마 — 배지, E/P를 3년 평균 순이익으로, EPS 변화 제외. 값은 연결 원자재(indices code, category commodity)
#   또는 none(연동이지만 무료 시세가 없음). commodity_by_ticker가 종목별로 우선한다
