# ---------------------------------------------------------------------
# 매력도 비교군(benchmark) — 화면 노출 종목(위 stocks)과 함께 점수의 비교 표본이 된다 (docs/09 9절)
# 국가별·섹터별 비교 표본 = 그 섹터의 노출 종목 + 상장 보통주 중 시가총액 상위 (per_sector − 노출 종목 수)개
# 섹터는 공식 업종 분류(국내 KRX 업종, 미국 SEC SIC)를 아래 sectors로 묶어 정한다. 위 peer_groups(테마)는 화면 경쟁 비교용
benchmark:
  per_sector: 50          # 국가별 섹터당 최대 종목 수(노출 종목 포함). 상장사가 그보다 적은 섹터는 있는 만큼
  us_rank_pool: 1500      # 미국: 시가총액 상위 이만큼만 SIC(업종)를 조회해 섹터를 정한다(SEC 호출 절약)
  sic_recheck_days: 365   # 미국 SIC는 거의 바뀌지 않아 1년마다만 다시 확인
  price_days: 400         # 일봉 보관 기간(달력일) — 변동성·12-1개월 모멘텀에 거래일 253개 필요
  fin_years: 3            # FY 재무 연수 (유효기간은 data_freshness — 공시 일정 기반 + 90일 상한)
  reselect_days: 30       # 시가총액 순위로 다시 고르는 주기(매일 고르면 경계 종목이 들락날락)
  daily_at_kst: "07:00"   # 매일 이 시각 이후 1회 갱신(미국 장 마감 후)
  detail_ttl_hours: 24    # 상세 화면을 열면 가격 증분 + 유효기간이 지난 데이터만 받고, 이 시간 동안은 다시 확인하지 않음

# 점수 비교 표본의 섹터(섹터 중립화 주 그룹). krx: KRX 업종명, sic: SEC SIC 코드 범위("시작-끝" 또는 단일)
# 한 SIC가 여러 범위에 걸리면 가장 좁은 범위가 이긴다. 어느 섹터에도 없으면 비교 표본에 넣지 않는다
# 금융·보험·부동산(KRX 기타금융·증권·보험·은행·금융·부동산, SIC 6000-6799)은 매출·영업이익 구조가 달라 제외
