# 매력도 모델 회귀 테스트 목록 v2 (2026-10-27, D-012)
#
# 한 번 찾은 반례를 "다시 나오면 안 되는 조건"으로 고정한 목록이다.
# 모델을 고칠 때마다 전부 돌려서 결과를 라운드 보고서와 검토_장부.md에 남긴다.
#
# status
#   required   : 반드시 통과해야 함. 실패하면 그 라운드는 종료 조건 불충족.
#   target     : 통과하면 좋지만 지금 데이터로는 어려울 수 있음. 결과만 기록.
#   known_fail : 알고 받아들인 실패. decision 에 결정 기록 번호를 적는다.
#
# 순위 정의 (D-012)
#   *_rank       : 같은 시장(market)·같은 묶음(family) 안 프리셋 종합 순위. 1이 가장 높음.
#   *_percentile : 같은 범위의 백분위(0~100, 높을수록 상위).
#   *_factor     : 팩터 F 값(재표준화 후).
#   not_scored   : 점수가 없음(신탁·지주 테마·리츠 등).
#   scored       : 점수가 있음.
# 종목코드는 DB 기준으로 한 번 확인할 것.
#
# 주의(순환성): independent: false 인 규칙만 통과했다고 개선됐다고 판단하지 말 것.

cases:
  # ── P1 성장성 기저효과 ──
  - id: SIRI-growth
    ticker: SIRI
    market: US
    check: growth_rank > 50
    status: required
    issue: P1
    why: 매출 3년 연속 감소, EPS 변화의 대부분이 전년 손실 항

  - id: RIVN-growth
    ticker: RIVN
    market: US
    check: growth_percentile < 80
    status: required
    issue: P1, R1-3
    why: 적자 지속인데 적자 축소만으로 성장 상위

  - id: INTC-growth
    ticker: INTC
    market: US
    check: growth_percentile < 80
    status: required
    issue: P1
    why: 적자 지속

  - id: LOTTE-HOLDINGS-growth
    ticker: "004990"   # 롯데지주
    market: KR
    check: growth_percentile < 80 or not_scored
    status: required
    issue: P1
    why: 적자 지속, 지주회사

  - id: ASIANA-growth
    ticker: "020560"   # 아시아나항공
    market: KR
    check: growth_percentile < 80
    status: required
    issue: P1
    why: 적자 지속

  # ── P2 일회성 순이익 ──
  - id: SARAMIN-balanced
    ticker: "143240"   # 사람인
    market: KR
    check: balanced_rank > 20 and value_rank > 20
    status: required
    issue: P2, P6
    why: 순이익 = 영업이익 × 5.5, 매출 3년 연속 감소

  - id: KCC-oneoff-cut
    ticker: "002380"   # KCC
    market: KR
    check: 일회성 해(순이익 > 1.2 × 영업이익)의 저평가 이익 e == 0.78 × 영업이익
    status: required
    issue: P2, R1-8
    why: 순이익 = 영업이익 × 3.6. 순위가 아니라 차단 장치를 검사한다(영업 기준으로는 실제로 쌈)

  - id: MICHANG-oneoff-cut
    ticker: "003650"   # 미창석유
    market: KR
    check: 일회성 해(순이익 > 1.2 × 영업이익)의 저평가 이익 e == 0.78 × 영업이익
    status: required
    issue: P2, R1-8
    why: 순이익 = 영업이익 × 2.0. KCC와 같음

  - id: KCC-MICHANG-badge
    ticker: ["002380", "003650"]
    market: KR
    check: 일회성 배지 표시
    status: required
    issue: P11
    why: 사용자가 순이익 기준 PER과 점수가 왜 다른지 알 수 있어야 함

  - id: WDC-value
    ticker: WDC
    market: US
    check: value_rank > 20
    status: required
    issue: P2, P5
    why: 지분 매각 이익(순이익 × 2.1), 메모리 업황

  # ── R1-1 연결 영업이익 ÷ 지배주주 시총 ──
  - id: HANIL-HOLDINGS-value
    ticker: "003300"   # 한일홀딩스
    market: KR
    check: value_rank > 10
    status: required
    issue: R1-1
    why: 영업이익 ÷ 시총이면 가치 4위. 세후 보수 이익으로 16위

  - id: HANIL-HOLDINGS-value-strict
    ticker: "003300"
    market: KR
    check: value_rank > 20
    status: required
    issue: R1-1, U-1
    why: V1(B/P만 중립화)로 이익 쪽 중립화가 빠져 해소. 라운드 2 측정 가치 41/298

  # ── P3 홈 순위 묶음 혼합 ──
  - id: HOME-family-mix
    target: home_attractiveness
    check: 한 목록 안에 family 가 섞이지 않음
    status: required
    issue: P3
    why: 현대해상(금융 30개 중 1위)이 SK하이닉스(일반 309개 중 1위)보다 위에 표시됨

  - id: SCREEN-no-phi-number
    target: stock 화면
    check: Φ 0~100 숫자 대신 "N개 중 M위 (상위 p%)"와 20% 구간 라벨 표시
    status: required
    issue: P3, P11
    why: Φ 점수와 실제 백분위가 최대 17.6점 어긋남

  - id: SCREEN-theme-position
    target: stock 화면
    check: 소속 테마의 같은 시장 내 위치(팩터별 구간) 표시
    status: required
    issue: U-1
    why: 약한 테마의 1등을 사용자가 구분할 수 있어야 함(D-003)

  - id: SCREEN-theme-position-momentum
    target: stock 화면
    check: 소속 테마 위치에 주가 흐름 포함 (THEME_FACTORS 에 momentum)
    status: required
    issue: R2-3, U-1
    why: NVDA 12-1 +24%(시장 60백분위)가 테마 대비로만 '약함'으로 보임

