# 매력도 모델 회귀 테스트 목록 v2 (2026-10-27, D-012)
#
# 한 번 찾은 반례를 "다시 나오면 안 되는 조건"으로 고정한 목록이다.
# 모델을 고칠 때마다 전부 돌려서 결과를 라운드 보고서와 검토_장부.md에 남긴다.
#
# status
#   required   : 반드시 통과해야 함. 실패하면 그 라운드는 종료 조건 불충족.
#   target     : 통과하면 좋지만 지금 데이터로는 어려울 수 있음. 결과만 기록.
#   known_fail : 알고 받아들인 실패. decision 에 결정 기록 번호를 적는다.
#
# 결과 집계 (D-030): 통과 / 감수한 실패(known_fail·결정 번호) / target 실패 / 미검증(데이터 없음·실행 불가) 네 칸,
#   required 실패는 따로. 감수한 실패는 종료를 막지 않지만 '통과'에 합치지 않는다. 미검증은 종료 코드에 넣지 않고 따로 적는다.
#   python -m app.ingest sanity --save --env deploy 가 배포 DB의 sanity_runs 표에 결과를 남긴다(배포 이미지에 이 파일이 들어 있다).
#
# 순위 정의 (D-012)
#   *_rank       : 같은 시장(market)·같은 묶음(family) 안 프리셋 종합 순위. 1이 가장 높음.
#   *_percentile : 같은 범위의 백분위(0~100, 높을수록 상위).
#   *_factor     : 팩터 F 값(재표준화 후).
#   not_scored   : 설계상 점수가 없음 — 표본 안에서 점수를 내지 않는 종목(금융·재무 없음 등)이거나
#                  점수를 내지 않는 테마(지주회사·신탁·리츠)라 표본에서 빠진 종목(D-004·D-014·D-025·D-028).
#   scored       : 점수가 있음.
#   표본 밖       : 검사할 종목이 그 밖의 이유(테마 시가총액 상위 n 밖·거래정지)로 비교군에 없으면 식을 계산하지 않고
#                  미검증으로 센다(D-043). 사유 칸에 '표본 밖(테마 상위 n 밖)'이 남는다. required 표본 밖 미검증이 3개를
#                  넘으면 케이스를 다시 정한다 — 종목 교체 대신 표본 전체 규칙으로 옮긴다(D-044).
# 종목코드는 DB 기준으로 한 번 확인할 것.
#
# 주의(순환성): independent: false 인 규칙만 통과했다고 개선됐다고 판단하지 말 것.

cases:
  # ── P1 성장성 기저효과 ──
