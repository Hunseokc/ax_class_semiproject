    issue: P1
    why: 매출 3년 연속 감소, EPS 변화의 대부분이 전년 손실 항
    # 수정 4 PR B 뒤 게임·엔터·미디어 US 상위 10 밖(cap_rank 808)이면 표본 밖 — 통과가 아니라 미검증(D-043)

