# 개별 종목이 아니라 표본 전체에 거는 규칙
rules:
  - id: R1-oneoff-top10
    check: 각 프리셋 top10 에 '순이익 > 영업이익 × 2' 이면서 저평가 이익이 잘리지 않은 종목 0개
    status: required
    independent: false
    issue: P2

  - id: R2-turnaround-growth
    check: 성장 top20 중 '2년 전 영업적자' 이면서 '2년 매출 CAGR ≤ 같은 시장 중앙값' 인 종목 ≤ 2개
    status: required
    independent: true
    issue: P1, R1-8
    why: 매출이 실제로 크게 는 흑자 전환(SK하이닉스·SNDK)은 반례가 아님

  - id: R3-value-trap
    check: 가치 top20 중 매출 2년 연속 감소 종목 ≤ 2개
    status: required
    independent: true
    issue: P6

  - id: R4-cycle-value
    check: 가치 top10 중 경기순환 테마(원자재 5개 + 메모리 반도체) 종목 ≤ 3개 — 메모리는 미국 MU·SNDK·WDC·STX, 국내 SK하이닉스, 시장별로 센다(D-017)
    status: target
    independent: true
    issue: P5, R1-8
    why: 이익 배수 기준은 실제 성장(NVDA·EXEL)도 걸어서 테마 기준으로 바꿈

  - id: R5-fiscal-gap-badge
    check: 결산일 차이 > 6개월 종목은 100% 경고 배지 표시
    status: required
    independent: true
    issue: P9, P11

  - id: R6-score-honesty
    check: 화면의 백분위 구간 라벨이 실제 백분위와 일치(구간 경계 오차 0)
    status: required
    independent: true
    issue: P11
    why: D-003으로 Φ 숫자를 빼므로 라벨 정확도를 검사

  - id: R7-badge-inflation
    check: 경고 배지(원자재 제외)가 붙는 종목 비율 ≤ 30%
    status: target
    independent: true
    issue: P11

  - id: R8-top10-stability
    check: 가중치 하나 ±0.1 변경 시 각 프리셋 top10 교집합 ≥ 7개
    status: target
    independent: true
    issue: P10
    why: D-003으로 해법을 표시로 옮겼으므로 측정만

  - id: R9-no-score-loss
    check: 모델 변경 전 점수가 있던 종목 중 재무가 있는데 칸이 비어 점수를 잃은 종목 0개 (재무가 아예 없는 종목은 따로 표시)
    status: required
    independent: true
    issue: R1-6
    decision: D-014
    why: 재무 원천이 없는 해외 상장 종목은 "재무 정보가 없어 표기할 수 없습니다"로 막는 것이 설계(D-014)

  - id: R10-independent-benchmark
    check: 11번 5절 독립 기준 이상 종목 수 ≤ 16, 우량 거짓 음성 ≤ 27
    status: required
    independent: true
    issue: D-002, R2-2
    why: k 3~8 측정 잡음(이상 12~16, 거짓 음성 25~27) 반영 — D-021

  - id: TRAP-penalty-only
    check: 가치 함정 신호의 최종 값(z_adj) ≤ 0 인 종목 100%
    status: required
    independent: false
    issue: U-1, D-018
    why: 중립화하지 않아 문자 그대로 감점만. 수정 1 모델은 559종목 중 313종목이 양수

  - id: WEAK-theme-first
    check: 프리셋 top20(시장 2 × 프리셋 4) 중 '중립화 전 테마 평균 종합 하위 30% 테마의 1등' 수 — 기록만
    status: target
    independent: false
    issue: U-1, D-022
    why: 정답 값이 없어 추세만 본다. 수정 1 모델 24, V1 측정 20

  - id: THEME-position-raw
    check: 화면 테마 위치 순위 = 중립화 전 값으로 만든 테마 평균 팩터 순위 (차이 0)
    status: required
    independent: false
    issue: R2-3, D-020
    why: 미국 바이오 성장성 화면 26위 vs 중립화 전 17위

  - id: CLIP-order
    check: 지표마다 같은 시장·묶음 원값 상위 7% 안에서 최종 z 순서와 원값 순서 Spearman ≥ 0.5
    status: required
    independent: false
    issue: R2-1, D-019
    why: 수정 1 모델 −0.47~0.31 (SNDK +1,093%가 묶음 16위). 회귀 방지용 — RN이 낫다는 근거로 세지 않는다

  - id: CURRENCY-krw
    check: 국내 표본에서 KRX EPS·BPS ÷ DB 재무 기준(순이익·지배 자본 ÷ 상장주식수)이 50배를 넘는 종목 0개
    status: required
    independent: true
    issue: R3-2
    decision: D-026

  - id: NEG-EQUITY-no-bp
    check: 최신 FY 지배 자본 ≤ 0 인 종목 중 B/P 값이 있는 종목 0개 (테마 평균에도 들어가지 않음)
    status: required
    independent: false
    issue: R3-3
    decision: D-027

  - id: ONEOFF-badge-recurring
    check: 일회성 배지 문구에 '일회성 이익으로 보고' 같은 단정 표현 없음, 이름 '순이익 > 영업이익'
    status: required
    independent: false
    issue: R3-5
    decision: D-029

  - id: PREF-share-basis
    check: KRX BPS 주식수가 보통주보다 3% 넘게 많은 종목에서 세후 보수 이익/시총 = e × 보통주 수 / BPS 주식수 / 보통주 시총
    status: required        # 라운드 3 제안은 target — D-029로 채택해 required
    independent: false
    issue: R3-6
    decision: D-029

  - id: TOP20-theme-reviewed
    check: 프리셋 top20(시장 2 × 프리셋 4) 중 업종 코드로만 분류되고 직접 지정·판정 목록에 없는 종목 수 — 기록만
    status: target
    independent: false
    issue: U-2
    decision: D-024
    why: 새로 상위에 오른 종목의 분류를 라운드마다 사람이 확인하게 함
