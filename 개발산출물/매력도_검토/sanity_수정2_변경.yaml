# sanity_cases.yaml 수정 2 변경안 (2026-10-27, D-018~D-023)
#
# 이 파일은 sanity_cases.yaml 에 적용할 변경 목록이다. 그대로 덮어쓰지 말고,
# 수정 2 세션이 각 PR에서 해당 항목만 sanity_cases.yaml 에 반영한다.
#   pr: A / B / C  — D-023의 PR 순서
#   action: add(추가) / change(기존 id 수정, 적힌 필드만 바꿈) / note(설명만)
# 라운드 2 보고서 7절 추가안을 기준으로 하고, 결정에 맞춰 status 를 조정했다.

# ── PR A: V1 (D-018) + 가치 함정 신호 중립화 해제 + R10 경계 (D-021) ──
- pr: A
  action: change
  id: HANIL-HOLDINGS-value-strict
  fields:
    status: required          # known_fail(D-001) → required. V1에서 가치 41위
    issue: R1-1, U-1
    decision: null            # 결정 번호 제거
    why: V1(B/P만 중립화)로 이익 쪽 중립화가 빠져 해소. 라운드 2 측정 가치 41/298

- pr: A
  action: change
  id: R10-independent-benchmark
  fields:
    check: 11번 5절 독립 기준 이상 종목 수 ≤ 16, 우량 거짓 음성 ≤ 27
    issue: D-002, R2-2
    why: k 3~8 측정 잡음(이상 12~16, 거짓 음성 25~27) 반영 — D-021

- pr: A
  action: add
  rule:
    id: TRAP-penalty-only
    check: 가치 함정 신호의 최종 값(z_adj) ≤ 0 인 종목 100%
    status: required
    independent: false
    issue: U-1, D-018
    why: 중립화하지 않아 문자 그대로 감점만. 수정 1 모델은 559종목 중 313종목이 양수

- pr: A
  action: add
  case:
    id: DNAUTO-weak-theme-first
    ticker: "007340"   # DN오토모티브 — 코드 DB 확인
    market: KR
    check: value_rank > 5
    status: target
    issue: U-1, U-2
    why: 2차전지 테마(적자·매출 감소) 안 1등이라 중립화로 지표가 부풀려짐. 수정 1 국내 가치 1위, V1 측정 7위

- pr: A
  action: add
  rule:
    id: WEAK-theme-first
    check: 프리셋 top20(시장 2 × 프리셋 4) 중 '중립화 전 테마 평균 종합 하위 30% 테마의 1등' 수 — 기록만
    status: target
    independent: false
    issue: U-1, D-022
    why: 정답 값이 없어 추세만 본다. 수정 1 모델 24, V1 측정 20

# ── PR B: 테마 위치 (D-020) ──
- pr: B
  action: add
  case:
    id: SCREEN-theme-position-momentum
    target: stock 화면
    check: 소속 테마 위치에 주가 흐름 포함 (THEME_FACTORS 에 momentum)
    status: required
    issue: R2-3, U-1
    why: NVDA 12-1 +24%(시장 60백분위)가 테마 대비로만 '약함'으로 보임

- pr: B
  action: add
  rule:
    id: THEME-position-raw
    check: 화면 테마 위치 순위 = 중립화 전 값으로 만든 테마 평균 팩터 순위 (차이 0)
    status: required
    independent: false
    issue: R2-3, D-020
    why: 미국 바이오 성장성 화면 26위 vs 중립화 전 17위

# ── PR C: RN (D-019) — PR C를 유지할 때만 넣는다 ──
- pr: C
  action: add
  rule:
    id: CLIP-order
    check: 지표마다 같은 시장·묶음 원값 상위 7% 안에서 최종 z 순서와 원값 순서 Spearman ≥ 0.5
    status: required
    independent: false
    issue: R2-1, D-019
    why: 수정 1 모델 −0.47~0.31 (SNDK +1,093%가 묶음 16위). 회귀 방지용 — RN이 낫다는 근거로 세지 않는다

- pr: C
  action: note
  text: >
    D-019 유지 조건 확인을 PR 설명에 적는다 — required 전부(MU-value 포함), R10(≤ 16 · ≤ 27),
    이상 + 거짓 음성 ≤ PR A 측정치 + 3. 하나라도 어기면 RN 을 되돌리고 CLIP-order 는 넣지 않는다.
