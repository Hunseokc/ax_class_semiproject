# ── PR D: 검증 장치 (D-030) ──
- pr: D
  action: note
  text: >
    sanity 실행기 출력을 4칸으로 바꾼다 — 통과 / 감수한 실패(known_fail·결정 번호) / target 실패 / 미검증(데이터 없음·실행 불가).
    required 판정은 '통과 + 감수한 실패 = required 수'일 때 성공이지만, 요약 줄에는 두 수를 따로 적는다.

